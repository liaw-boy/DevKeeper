name: CI

on:
  push:
  pull_request:

jobs:
  macos:
    name: macOS (app + CLI + tests)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Build
        run: swift build -c release
      - name: Test
        run: swift test
      - name: CLI smoke test
        run: |
          .build/release/devkeeper-cli version
          .build/release/devkeeper-cli python list

  linux:
    name: Linux (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ["swift:5.10-jammy", "swift:6.0-noble"]
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      # The SwiftUI app is macOS-only; build just the shared core and the command-line tool.
      - name: Build CLI
        run: swift build -c release --product devkeeper-cli
      - name: Test core
        run: swift test
      - name: CLI smoke test
        run: |
          .build/release/devkeeper-cli version
          .build/release/devkeeper-cli python list
          .build/release/devkeeper-cli scan
          .build/release/devkeeper-cli scan --json > scan.json
          # Exit 1 means vulnerabilities were found, 3 means some OSV lookups failed (network); both are fine here.
          .build/release/devkeeper-cli audit --json > audit.json || { code=$?; test $code -eq 1 -o $code -eq 3; }
          head -c 400 scan.json
      # The Swift image has no Python; install the distribution's own to exercise interpreter discovery,
      # PEP 668 detection and the distro-bundled package exclusion.
      - name: Python discovery smoke test
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq python3 python3-pip python3-venv > /dev/null
          .build/release/devkeeper-cli python list
          .build/release/devkeeper-cli python list --json
          .build/release/devkeeper-cli scan
          .build/release/devkeeper-cli audit --all || { code=$?; test $code -eq 1 -o $code -eq 3; }
      # The local web interface: it must answer with the token and refuse without it.
      - name: Web interface smoke test
        run: |
          apt-get install -y -qq curl > /dev/null
          .build/release/devkeeper-cli serve --port 8765 > serve.log &
          SERVER_PID=$!
          sleep 3
          TOKEN=$(grep -o 'token=[0-9a-f]*' serve.log | head -1 | cut -d= -f2)
          curl -sf -H "Authorization: Bearer $TOKEN" http://127.0.0.1:8765/api/python | head -c 200
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8765/api/python)" = 403
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: example.test' -H "Authorization: Bearer $TOKEN" http://127.0.0.1:8765/api/python)" = 403
          kill $SERVER_PID

  linux-release-binary:
    name: Linux release binary
    runs-on: ubuntu-latest
    needs: linux
    container: swift:6.0-noble
    steps:
      - uses: actions/checkout@v4
      - name: Build static CLI
        run: swift build -c release --product devkeeper-cli --static-swift-stdlib
      - name: Package
        run: |
          mkdir -p dist
          cp .build/release/devkeeper-cli dist/
          cd dist && tar czf devkeeper-cli-linux-x86_64.tar.gz devkeeper-cli && sha256sum devkeeper-cli-linux-x86_64.tar.gz > devkeeper-cli-linux-x86_64.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: devkeeper-cli-linux-x86_64
          path: dist/

  linux-gui:
    name: Linux GUI (Python tests + AppImage)
    runs-on: ubuntu-22.04
    needs: linux-release-binary
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: devkeeper-cli-linux-x86_64
          path: cli
      - name: System libraries for Qt and AppImage
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libfuse2 libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 desktop-file-utils \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 libxcb-util1 libxkbcommon-x11-0 > /dev/null
      - name: Python tests
        working-directory: linux-gui
        run: |
          pip install -q -e ".[test]"
          QT_QPA_PLATFORM=offscreen pytest -q
      - name: Build AppImage
        working-directory: linux-gui
        run: |
          tar xzf ../cli/devkeeper-cli-linux-x86_64.tar.gz -C ../cli
          packaging/build-appimage.sh "$PWD/../cli/devkeeper-cli"
      - name: Bundled CLI JSON output
        run: |
          for c in "scan" "python list" "audit"; do
            echo "== $c"; ../cli/devkeeper-cli $c --json 2>&1 | head -c 300; echo "[exit ${PIPESTATUS[0]}]"
          done
        working-directory: linux-gui
      # Starts the packaged app, which runs its bundled CLI and fails if any page could not load.
      - name: AppImage smoke test
        working-directory: linux-gui
        run: |
          QT_QPA_PLATFORM=offscreen ./DevKeeper-x86_64.AppImage --appimage-extract-and-run --check
      - uses: actions/upload-artifact@v4
        with:
          name: DevKeeper-x86_64.AppImage
          path: linux-gui/DevKeeper-x86_64.AppImage
