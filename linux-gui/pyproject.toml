[project]
name = "devkeeper-gui"
version = "0.1.0"
description = "Read-only desktop view for devkeeper-cli (Linux and macOS)"
requires-python = ">=3.9"
dependencies = ["PySide6>=6.6,<7"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
devkeeper-gui = "devkeeper_gui.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["devkeeper_gui"]

[tool.pytest.ini_options]
testpaths = ["tests"]
